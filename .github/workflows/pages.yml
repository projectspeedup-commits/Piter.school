name: Сборка и публикация сайта

# При каждом пуше в main собираем сайт из .md файлов
# и публикуем его в ветку gh-pages (GitHub Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Собрать сайт (сканирование .md → site/)
        run: python build.py

      - name: Опубликовать в gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
